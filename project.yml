name: Relay
options:
  bundleIdPrefix: com.brandonhull
  deploymentTarget:
    iOS: "17.0"

targets:
  Relay:
    type: application
    platform: iOS
    sources:
      - path: App/Sources/App
      - path: App/Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Relay needs microphone access to record podcast episodes."
        NSSpeechRecognitionUsageDescription: "Relay uses on-device speech recognition to transcribe your recordings before sending them to Craft."
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
    entitlements:
      path: App/Relay.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
    settings:
      PRODUCT_NAME: Relay
      PRODUCT_BUNDLE_IDENTIFIER: com.brandonhull.relay
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: D53LTKT473
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_USER_SCRIPT_SANDBOXING: YES
      STRING_CATALOG_GENERATE_SYMBOLS: YES

schemes:
  Relay:
    build:
      targets:
        Relay: all
    run:
      config: Debug
